# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Cybercolombia.org
subtitle: Driving HPC and AI-powered solutions for Colombia’s digital future and Latin America
url: "https://cybercolombia.org"
baseurl: ""
locale: "en-US"
email:
description: >- # this means to ignore newlines until "baseurl:"
  CyberColombia connects academia, industry, and international partners to advance
  high-performance computing, artificial intelligence, scientific computing, and
  quantum technologies across Colombia and Latin America.
logo: "/assets/images/logo.png"
twitter_username: "@hpccol"
repository: "cybercolombia/cybercolombia.github.io"
github: [metadata]
github_username: cybercolombia
linkedin_username: 76894044 
minimal_mistakes_skin: contrast #default
search: false
author_profile: false
breadcrumbs: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 15 # amount of posts to show
paginate_path: /page:num/
timezone: America/Bogota # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/hpccol"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/cybercolombia"
    - label: "Linkedin"
      icon:  "fab fa-fw fa-linkedin-in"
      url: "https://www.linkedin.com/company/76894044/"
    - label: "Blog"
      icon: "fas fa-fw fa-pen-nib"
      url: "/blog/"
    - label: "Brand assets"
      icon: "fas fa-fw fa-palette"
      url: "/about/"
    - label: "Privacy"
      icon: "fas fa-fw fa-shield-alt"
      url: "/privacy/"

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # _posts
  - scope:
      path: "events"
      type: pages
    values:
      layout: single
      author_profile: false
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: true
      related: true

category_archive:
  type: liquid
  path: /categories/
  author_profile: false

tag_archive:
  type: liquid
  path: /tags/
  author_profile: false

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-YEDWN6V24L"
    anonymize_ip: true
